<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>HeadShotz – Free Multiplayer FPS</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>

<!-- MENU -->
<div id="menu" class="screen">
  <h1>HEAD<span>SHOTZ</span></h1>
  <p class="sub">Free multiplayer shooter · no ads · no purchases · everything unlocked</p>
  <input id="nameIn" maxlength="12" placeholder="Your name">
  <button id="createBtn" class="big">Create Room</button>
  <div class="row"><input id="codeIn" maxlength="5" placeholder="CODE" style="text-transform:uppercase;width:120px"><button id="joinBtn" class="big">Join</button></div>
  <p id="menuMsg" class="msg"></p>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen hidden">
  <div class="lobbyTop">
    <div>Room <b id="roomCode"></b></div>
    <button id="shareBtn">📋 Copy invite link</button>
  </div>
  <div class="lobbyGrid">
    <div class="panel"><h3>Players <span id="pCount"></span></h3><ul id="pList"></ul>
      <div id="hostCtl"><button id="botAdd">+ Bot</button><button id="botDel">− Bot</button></div></div>
    <div class="panel"><h3>Mode</h3><div id="modeBtns"></div>
      <h3>Vote Map</h3><div id="mapBtns"></div></div>
    <div class="panel"><h3>Loadout</h3><div id="loadout"></div></div>
  </div>
  <button id="startBtn" class="big">START MATCH</button>
  <p id="lobbyMsg" class="msg"></p>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="cross"><i></i><i></i><i></i><i></i><b id="hitX">✕</b></div>
  <div id="scoreTop"><span id="scA" class="tA">0</span><span id="roundInfo">Round 1</span><span id="scB" class="tB">0</span></div>
  <div id="timer"></div>
  <div id="center"></div>
  <div id="feed"></div>
  <div id="hpBox"><div id="hpBar"><div id="hpFill"></div></div><span id="hpTxt">100</span></div>
  <div id="ammoBox"><span id="wName"></span><span id="ammo"></span></div>
  <div id="slots"></div>
  <div id="dmgLayer"></div>
  <div id="vign"></div>
  <div id="scope" class="hidden"></div>
  <div id="touch" class="hidden">
    <div id="joyBase"><div id="joyKnob"></div></div>
    <button class="tb" id="bFire">🔥</button>
    <button class="tb" id="bJump">⤒</button>
    <button class="tb" id="bSlide">⤓</button>
    <button class="tb" id="bReload">R</button>
    <button class="tb" id="bSwap">⇄</button>
    <button class="tb" id="bNade">💣</button>
    <button class="tb" id="bZoom">🔍</button>
  </div>
  <button id="menuBtn">☰</button>
  <div id="board" class="hidden"></div>
</div>
<div id="rotate">Rotate your phone sideways 📱↻</div>

<script src="lib/peerjs.min.js"></script>
<script src="lib/localpeer.js"></script>
<script type="module" src="game.js"></script>
</body></html>
